name: CI

on:
  push:
    branches-ignore: [main]   # on main, cd.yml runs this workflow instead
  pull_request:
  workflow_call:              # lets cd.yml reuse this workflow before deploying

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [solves, stats]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # A throwaway SQL Server for the database tests. Its password is random for each
      # run and masked in the logs, so nothing is stored. CI never touches Azure SQL.
      - name: Start SQL Server
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 16)"
          echo "::add-mask::$SA_PASSWORD"
          echo "TEST_DATABASE_URL=mssql://sa:$SA_PASSWORD@localhost:1433/master" >> "$GITHUB_ENV"
          docker run -d -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest
      # Fails the job if this service's coverage is under 70%.
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  # Checks that each openapi.yaml is a valid OpenAPI document and that system.yaml follows system.schema.json.
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator==0.9.0 check-jsonschema==0.39.0
      - run: openapi-spec-validator services/solves/openapi.yaml services/stats/openapi.yaml
      - run: check-jsonschema --schemafile system.schema.json system.yaml

  images:
    needs: [test, specs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        service: [solves, stats]
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/speedcubing-${{ matrix.service }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false     # a plain image: Container Apps can't pull a tag that points to an attestation index
